<svg xmlns="http://www.w3.org/2000/svg" width="348" height="756" viewBox="0 0 348 756"><defs></defs><rect id="Background" width="348" height="756" fill="rgb(234,244,251)"/><rect id="ui: ‹" x="0.0" y="0.0" width="348.0" height="756.0" rx="0.0" fill="rgb(234,244,251)"/><g id="a-bar: ‹"><g id="a-back: ‹"><rect id="a-back: ‹" x="16.0" y="34.0" width="48.0" height="48.0" rx="14.0" fill="rgb(255,255,255)"/><text id="‹" font-family="Andika" font-size="22" font-weight="700" fill="rgb(31,42,68)"><tspan x="35.7" y="65.5">‹</tspan></text></g><text id="Parents and teachers" font-family="Andika" font-size="21" font-weight="700" fill="rgb(31,42,68)"><tspan x="74.0" y="65.1">Parents and teachers</tspan></text></g><g id="tabs: Talk"><g id="button: Talk"><rect id="button: Talk" x="16.0" y="92.0" width="74.5" height="40.0" rx="12.0" fill="rgb(36,116,198)"/><text id="Talk" font-family="Andika" font-size="12.5" font-weight="700" fill="rgb(255,255,255)"><tspan x="40.1" y="116.3">Talk</tspan></text></g><g id="button: Signs"><rect id="button: Signs" x="96.5" y="92.0" width="74.5" height="40.0" rx="12.0" fill="rgb(255,255,255)"/><text id="Signs" font-family="Andika" font-size="12.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="117.4" y="116.3">Signs</tspan></text></g><g id="button: Get help"><rect id="button: Get help" x="177.0" y="92.0" width="74.5" height="40.0" rx="12.0" fill="rgb(255,255,255)"/><text id="Get help" font-family="Andika" font-size="12.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="189.1" y="116.3">Get help</tspan></text></g><g id="button: Settings"><rect id="button: Settings" x="257.5" y="92.0" width="74.5" height="40.0" rx="12.0" fill="rgb(255,255,255)"/><text id="Settings" font-family="Andika" font-size="12.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="269.6" y="116.3">Settings</tspan></text></g></g><g id="rcard: Use the right names for body par"><rect id="rcard: Use the right names for body par" x="16.0" y="142.0" width="316.0" height="101.1" rx="14.0" fill="rgb(255,255,255)"/><text id="Use the right names for body parts" font-family="Andika" font-size="14.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="28.0" y="169.9">Use the right names for body parts</tspan></text><text id="Children who know the correct words can " font-family="Andika" font-size="12.5" font-weight="400" fill="rgb(95,111,134)"><tspan x="28.0" y="192.7">Children who know the correct words can explain</tspan><tspan x="28.0" y="209.6">what happened. Name private parts calmly, the</tspan><tspan x="28.0" y="226.5">same way you name an elbow or a knee.</tspan></text></g><g id="rcard: Surprises, not secrets"><rect id="rcard: Surprises, not secrets" x="16.0" y="251.1" width="316.0" height="84.2" rx="14.0" fill="rgb(255,255,255)"/><text id="Surprises, not secrets" font-family="Andika" font-size="14.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="28.0" y="279.0">Surprises, not secrets</tspan></text><text id="A surprise is fun and is told soon. A se" font-family="Andika" font-size="12.5" font-weight="400" fill="rgb(95,111,134)"><tspan x="28.0" y="301.8">A surprise is fun and is told soon. A secret that</tspan><tspan x="28.0" y="318.7">makes you feel worried should always be told.</tspan></text></g><g id="rcard: Ask after each lesson"><rect id="rcard: Ask after each lesson" x="16.0" y="343.3" width="316.0" height="84.2" rx="14.0" fill="rgb(255,255,255)"/><text id="Ask after each lesson" font-family="Andika" font-size="14.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="28.0" y="371.2">Ask after each lesson</tspan></text><text id="Ask your child to teach you STOP, and le" font-family="Andika" font-size="12.5" font-weight="400" fill="rgb(95,111,134)"><tspan x="28.0" y="394.0">Ask your child to teach you STOP, and let them</tspan><tspan x="28.0" y="410.9">name their trusted adults.</tspan></text></g><g id="rcard: If your child tells you somethin"><rect id="rcard: If your child tells you somethin" x="16.0" y="435.5" width="316.0" height="101.1" rx="14.0" fill="rgb(255,255,255)"/><text id="If your child tells you something" font-family="Andika" font-size="14.5" font-weight="700" fill="rgb(31,42,68)"><tspan x="28.0" y="463.5">If your child tells you something</tspan></text><text id="Stay calm, believe them, thank them, and" font-family="Andika" font-size="12.5" font-weight="400" fill="rgb(95,111,134)"><tspan x="28.0" y="486.3">Stay calm, believe them, thank them, and tell</tspan><tspan x="28.0" y="503.1">them it is not their fault. Contact the services</tspan><tspan x="28.0" y="520.0">under Get help.</tspan></text></g></svg>